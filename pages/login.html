<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - SportSwear</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main>
    <div class="auth-page">
      <div class="auth-container">
        <section class="auth-card" aria-labelledby="auth-title">
          <h1 id="auth-title">Bienvenido a SportSwear</h1>
          <p class="auth-card-subtitle">Accede a tu cuenta o crea una nueva</p>

          <div class="auth-tabs" role="tablist" aria-label="Auth tabs">
            <button type="button" class="auth-tab active" id="login-tab" aria-selected="true">Iniciar Sesión</button>
            <button type="button" class="auth-tab" id="register-tab" aria-selected="false">Crear Cuenta</button>
          </div>

          <div class="auth-forms">
            <form id="login-form" class="auth-form" style="display:block;" aria-labelledby="login-tab">
              <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input id="email" type="email" class="form-input" placeholder="tu@email.com" required>
              </div>
              <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" class="form-input" placeholder="••••••••" required>
              </div>
              <div style="display:flex; gap:12px; align-items:center; justify-content:space-between;">
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                <a href="recuperar-contrasena.html" class="link-muted">¿Olvidaste tu contraseña?</a>
              </div>
            </form>

            <form id="register-form" class="auth-form" style="display:none;" aria-labelledby="register-tab">
              <div class="form-group"><label for="first-name">Nombre</label><input id="first-name" type="text" class="form-input" placeholder="Juan" required></div>
              <div class="form-group"><label for="last-name">Apellido</label><input id="last-name" type="text" class="form-input" placeholder="Pérez" required></div>
              <div class="form-group"><label for="register-email">Correo</label><input id="register-email" type="email" class="form-input" placeholder="tu@email.com" required></div>
              <div class="form-group"><label for="register-password">Contraseña</label><input id="register-password" type="password" class="form-input" placeholder="••••••••" required></div>
              <div class="form-group"><label for="confirm-password">Confirmar</label><input id="confirm-password" type="password" class="form-input" placeholder="••••••••" required></div>
              <button type="submit" class="btn btn-primary">Crear Cuenta</button>
            </form>
          </div>

          <!-- admin quick access removed per request -->
        </section>
      </div>
    </div>
  </main>

  <footer class="footer"> <!-- simplified footer -->
    <div class="footer-bottom">&copy; 2026 SportSwear</div>
  </footer>

  <script>
    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const tabFooter = document.getElementById('tab-footer');

    function switchTab(tab) {
      if (tab === 'login') { loginTab.classList.add('active'); registerTab.classList.remove('active'); loginForm.style.display='block'; registerForm.style.display='none'; }
      else { registerTab.classList.add('active'); loginTab.classList.remove('active'); registerForm.style.display='block'; loginForm.style.display='none'; }
    }
    loginTab && loginTab.addEventListener('click', () => switchTab('login'));
    registerTab && registerTab.addEventListener('click', () => switchTab('register'));

    registerForm && registerForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const first = document.getElementById('first-name').value.trim();
      const last = document.getElementById('last-name').value.trim();
      const email = document.getElementById('register-email').value.trim();
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (password !== confirm) { alert('Las contraseñas no coinciden'); return; }
      if (password.length > 8) { alert('La contraseña debe tener máximo 8 caracteres.'); return; }
      fetch('https://back-sportswear.onrender.com/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ nombre: first+' '+last, correo: email, contraseña: password, rol:'Usuario' }) })
        .then(async res=>{ const t=await res.text(); try{return JSON.parse(t);}catch(e){return {raw:t,ok:res.ok}} })
        .then(data=>{ const ok = data && (data.id || data.success || data.ok || (data.raw && data.raw.toLowerCase().includes('success'))); if (ok){ alert('Cuenta creada. Por favor inicia sesión'); switchTab('login'); } else { alert('Error: '+(data.message||data.mensaje||data.raw||JSON.stringify(data))); } })
        .catch(err=>{ console.error(err); alert('Error de conexión al registrar usuario'); });
    });
  </script>

  <script src="../js/main.js"></script>

  <script>
    const API_BASE = 'https://back-sportswear.onrender.com/api';
    const adminBtn = document.getElementById('admin-login-btn');
    const formLogin = document.getElementById('login-form');

    function handleLogin(email,password){
      return fetch('https://back-sportswear.onrender.com/auth',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password }) })
        .then(async res=>{ const t=await res.text(); try{return JSON.parse(t);}catch(e){return { raw:t, ok:res.ok }} });
    }

    function fetchUserById(id, token) {
      const opts = token ? { headers: { 'Authorization': 'Bearer ' + token } } : {};
      return fetch(`${API_BASE}/users/${id}`, opts)
        .then(async r => {
          const text = await r.text();
          try {
            const parsed = JSON.parse(text);
            console.log('fetchUserById parsed:', parsed);
            return parsed;
          } catch (e) {
            console.log('fetchUserById raw:', text);
            return { raw: text, ok: r.ok };
          }
        });
    }

    function fetchUserByEmail(email, token) {
      const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
      const url = `${API_BASE}/users?correo=${encodeURIComponent(email)}&email=${encodeURIComponent(email)}`;
      return fetch(url, { headers })
        .then(async r => {
          const text = await r.text();
          try {
            const parsed = JSON.parse(text);
            console.log('fetchUserByEmail parsed:', parsed);
            return parsed;
          } catch (e) {
            console.log('fetchUserByEmail raw:', text);
            return { raw: text, ok: r.ok };
          }
        })
        .then(data => {
          if (!data) return null;
          if (Array.isArray(data) && data.length) return data[0];
          if (data.user) return data.user;
          return data;
        });
    }

    function proceedWithUser(u) {
      if (!u) { alert('No se pudo obtener datos del usuario'); return; }
      // Debug: show the fetched user object if rol is missing
      if (!u.rol && !u.role) console.log('Usuario sin rol recibido del backend:', u);
      // normalize role value
      const rawRole = (u.rol || u.role || '').toString().trim();
      const roleLower = rawRole.toLowerCase();
      // consider 'administrador' or 'admin' as admin
      const isAdmin = roleLower === 'administrador' || roleLower === 'admin' || roleLower.includes('admin');
      localStorage.setItem('user', JSON.stringify(u));
      if (isAdmin) {
        localStorage.setItem('isAdmin', 'true');
        window.location.href = 'admin-productos.html';
      } else {
        localStorage.removeItem('isAdmin');
        // non-admin users go to home
        window.location.href = 'home.html';
      }
    }

    if(adminBtn){ adminBtn.addEventListener('click', ()=>{ const adminEmail='admin@sportswear.com', adminPass='1234'; handleLogin(adminEmail,adminPass).then(data=>{ const token = (data && (data.token||data.access_token||data.jwt)) || (data.user && (data.user.token||data.user.access_token)) || null; const id = (data && data.user && data.user.id) || data.id || null; if(id) fetchUserById(id,token).then(proceedWithUser).catch(err=>{console.error(err);alert('Error al consultar usuario por id')}); else fetchUserByEmail(adminEmail,token).then(proceedWithUser).catch(err=>{console.error(err);alert('Error al consultar usuario por email')}); }).catch(err=>{console.error(err);alert('Error de conexión al iniciar sesión.'); }); }); }

    if(formLogin){ formLogin.addEventListener('submit', function(e){ e.preventDefault(); const email=document.getElementById('email').value.trim(); const password=document.getElementById('password').value; handleLogin(email,password).then(data=>{ const token = (data && (data.token||data.access_token||data.jwt)) || (data.user && (data.user.token||data.user.access_token)) || null; const id = (data && data.user && data.user.id) || data.id || null; if(id) return fetchUserById(id,token).then(u=>{ proceedWithUser(u); }); return fetchUserByEmail(email,token).then(u=>{ if(u) proceedWithUser(u); else { localStorage.setItem('user', JSON.stringify(data.user||data)); window.location.href='home.html'; } }); }).catch(err=>{ console.error(err); alert('Error de conexión al iniciar sesión.'); }); }); }
  </script>

</body>
</html>
  }
